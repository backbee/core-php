stages:
    - release

create_release:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    rules:
        -   if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:\.\d+)?(?:-[a-z]+\d*)?$/'
    script:
        - echo "Create release $CI_COMMIT_TAG"
    release:
        name: 'Release $CI_COMMIT_TAG'
        description: |
            # Release $CI_COMMIT_TAG
            
            ## Changes
            $(git log --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo $(git rev-list --max-parents=0 HEAD))..$CI_COMMIT_TAG)
            
            **Pipeline :** $CI_PIPELINE_URL
        tag_name: '$CI_COMMIT_TAG'
        ref: '$CI_COMMIT_SHA'